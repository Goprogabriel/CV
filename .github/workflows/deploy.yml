name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and lint
        run: pnpm check && pnpm lint
      - name: Build static site
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_BASE_PATH: ${{ vars.BASE_PATH }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$CUSTOM_SITE_URL" ]; then
            export SITE_URL="$CUSTOM_SITE_URL"
            export BASE_PATH="$CUSTOM_BASE_PATH"
          elif [[ "$REPOSITORY_NAME" == *.github.io ]]; then
            export SITE_URL="https://${REPOSITORY_OWNER}.github.io"
            export BASE_PATH=""
          else
            export SITE_URL="https://${REPOSITORY_OWNER}.github.io"
            export BASE_PATH="$REPOSITORY_NAME"
          fi
          pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
